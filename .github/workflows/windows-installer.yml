name: Windows test installer

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y
      - name: Build and package Windows app
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: vortal-windows-test-installer
          path: dist/windows-native/Vortal-Setup-Rust-x64.exe
          if-no-files-found: error
