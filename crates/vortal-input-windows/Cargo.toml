[package]
name = "vortal-input-windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vortal-input = { path = "../vortal-input" }
anyhow.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "deny"
